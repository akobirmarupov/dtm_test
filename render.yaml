databases:
  - name: dtm-test-db
    databaseName: dtm_test
    user: dtm_test
    plan: free

services:
  - type: redis
    name: dtm-test-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: dtm-test
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: dtm-test.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://dtm-test.onrender.com
      # Frontend deploy qilingach shu qiymatni real domenga almashtiring.
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: dtm-test-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dtm-test-redis
          type: redis
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_IDS
        sync: false
      - key: ADMIN_TELEGRAM_LINK
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false

  # E'lon tarqatish va obuna arizalarini Telegramga yuborish shu worker'da.
  - type: worker
    name: dtm-test-worker
    runtime: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    # `--beat` — obuna muddatlarini kunlik tozalab turuvchi jadval.
    startCommand: "celery -A config worker --beat --loglevel=info --concurrency=2"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        fromService:
          name: dtm-test
          type: web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: dtm-test-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: dtm-test-redis
          type: redis
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_IDS
        sync: false
      - key: ADMIN_TELEGRAM_LINK
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
