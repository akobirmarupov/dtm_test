version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: unitest_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-unitest_db}
      POSTGRES_USER: ${DB_USER:-unitest_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-unitest_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-unitest_user} -d ${DB_NAME:-unitest_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unitest_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unitest_backend
    restart: always
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-unitest-secret-key-change-in-prod}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-unitest_db}
      DB_USER: ${DB_USER:-unitest_user}
      DB_PASSWORD: ${DB_PASSWORD:-unitest_secure_password}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      CORS_ALLOW_ALL_ORIGINS: ${CORS_ALLOW_ALL_ORIGINS:-True}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
    volumes:
      - backend_media:/app/media
      - backend_static:/app/staticfiles
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unitest_celery_worker
    restart: always
    command: celery -A config worker --loglevel=info
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-unitest-secret-key-change-in-prod}
      DEBUG: ${DEBUG:-False}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-unitest_db}
      DB_USER: ${DB_USER:-unitest_user}
      DB_PASSWORD: ${DB_PASSWORD:-unitest_secure_password}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unitest_celery_beat
    restart: always
    command: celery -A config beat --loglevel=info
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-unitest-secret-key-change-in-prod}
      DEBUG: ${DEBUG:-False}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-unitest_db}
      DB_USER: ${DB_USER:-unitest_user}
      DB_PASSWORD: ${DB_PASSWORD:-unitest_secure_password}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - backend

  frontend:
    build:
      context: ../univora test
      dockerfile: Dockerfile
    container_name: unitest_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_static:
