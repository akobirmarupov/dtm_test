<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UVENT — Google orqali kirish</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0b0b0d;
    --bg-1:#141416;
    --surface:#18181b;
    --surface-2:#1f1f23;
    --line:#2a2a2f;
    --text-0:#f3f1ec;
    --text-1:#a9a8ae;
    --text-2:#6f6e75;
    --orange-1:#ff8a1f;
    --orange-2:#ff5a00;
    --steel-1:#c7c9cf;
    --steel-2:#77797f;
    --ok:#33d17a;
    --radius:20px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:var(--bg-0);
    color:var(--text-0);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px;
    position:relative;
    overflow-x:hidden;
  }

  /* ambient backdrop: faint diagonal seams echoing the logo's panel lines */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(60% 50% at 82% 12%, rgba(255,90,0,0.10), transparent 60%),
      radial-gradient(50% 40% at 12% 88%, rgba(255,138,31,0.06), transparent 60%),
      repeating-linear-gradient(135deg, transparent 0 120px, rgba(255,255,255,0.012) 120px 121px),
      var(--bg-0);
    z-index:0;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ---- logo block ---- */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:34px;
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }

  .logo-wrap{
    position:relative;
    width:96px;
    height:96px;
    margin-bottom:18px;
    border-radius:26px;
    overflow:hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 18px 40px -12px rgba(255,90,0,0.35);
  }

  .logo-wrap::after{
    content:"";
    position:absolute;
    inset:-40%;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(255,138,31,0.55) 25deg, transparent 70deg, transparent 360deg);
    animation:spin 5s linear infinite;
    mix-blend-mode:screen;
    opacity:.8;
  }

  .logo-wrap img{
    position:relative;
    z-index:1;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  .wordmark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.04em;
    display:flex;
    align-items:baseline;
    gap:2px;
  }
  .wordmark .u{color:var(--steel-1);}
  .wordmark .vent{
    background:linear-gradient(120deg,var(--orange-1),var(--orange-2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    margin-top:6px;
    font-size:13px;
    color:var(--text-2);
    letter-spacing:0.14em;
    text-transform:uppercase;
  }

  /* ---- card ---- */
  .card{
    position:relative;
    width:100%;
    background:linear-gradient(180deg,var(--surface),var(--bg-1));
    border-radius:var(--radius);
    padding:1px;
    animation:rise .8s .05s cubic-bezier(.2,.8,.2,1) both;
  }

  .card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    padding:1px;
    background:conic-gradient(from var(--sweep,0deg), transparent 0 60deg, rgba(255,122,26,0.9) 90deg, transparent 130deg, transparent 360deg);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;
    mask-composite:exclude;
    animation:sweep 4.5s linear infinite;
    opacity:.55;
    pointer-events:none;
  }

  @keyframes sweep{
    to{ --sweep:360deg; }
  }
  @property --sweep{
    syntax:'<angle>';
    inherits:false;
    initial-value:0deg;
  }

  .card-inner{
    position:relative;
    background:var(--surface);
    border-radius:calc(var(--radius) - 1px);
    padding:32px 28px 28px;
  }

  .card-head{
    text-align:center;
    margin-bottom:24px;
  }
  .card-head h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:19px;
    font-weight:600;
    margin:0 0 6px;
  }
  .card-head p{
    margin:0;
    font-size:13.5px;
    color:var(--text-1);
    line-height:1.5;
  }

  /* google button housing */
  .signin-slot{
    display:flex;
    justify-content:center;
    margin:6px 0 22px;
  }

  .status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--text-2);
    justify-content:center;
    margin-bottom:18px;
    opacity:0;
    transition:opacity .3s;
  }
  .status.show{opacity:1;}
  .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 8px var(--ok);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:1;}
    50%{ transform:scale(1.4); opacity:.6;}
  }

  /* token frame */
  .token-frame{
    position:relative;
    border:1px solid var(--line);
    background:var(--bg-1);
    border-radius:14px;
    padding:16px 16px 14px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height .5s cubic-bezier(.2,.8,.2,1), opacity .4s ease, margin .5s ease;
  }
  .token-frame.visible{
    max-height:340px;
    opacity:1;
    margin-top:4px;
  }

  .token-frame-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .token-frame-label span{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text-2);
    font-weight:500;
  }

  .token-box{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    line-height:1.6;
    color:var(--steel-1);
    word-break:break-all;
    max-height:160px;
    overflow-y:auto;
    padding-right:4px;
  }
  .token-box::-webkit-scrollbar{width:6px;}
  .token-box::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}

  .copy-btn{
    margin-top:14px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 16px;
    border-radius:11px;
    border:1px solid var(--line);
    background:var(--surface-2);
    color:var(--text-0);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    transition:background .2s, border-color .2s, transform .15s;
  }
  .copy-btn:hover{
    background:#242428;
    border-color:#3a3a40;
  }
  .copy-btn:active{ transform:scale(.98); }

  .copy-btn.copied{
    background:rgba(51,209,122,0.12);
    border-color:rgba(51,209,122,0.4);
    color:var(--ok);
  }

  .copy-btn svg{ width:15px; height:15px; flex-shrink:0; }

  .foot-note{
    text-align:center;
    margin-top:22px;
    font-size:11.5px;
    color:var(--text-2);
    animation:rise .9s .1s cubic-bezier(.2,.8,.2,1) both;
  }
  .foot-note b{ color:var(--text-1); font-weight:600; }

  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }

  @media (max-width:480px){
    .card-inner{ padding:26px 18px 22px; }
    .wordmark{ font-size:24px; }
  }
</style>
</head>

    <div class="card">
      <div class="card-inner">
        <div class="card-head">
          <h1>Google orqali kirish testi</h1>
          <p>Hisobingizni tanlang — UVENT tizimi uchun id_token shu yerda hosil bo'ladi.</p>
        </div>

        <div class="signin-slot">
          <div id="g_id_onload"
               data-client_id="491787279295-4paiavfbv21q43qh8rqtmv8jfkvp3buj.apps.googleusercontent.com"
               data-callback="handleCredentialResponse"
               data-auto_prompt="false">
          </div>
          <div class="g_id_signin"
               data-type="standard"
               data-shape="pill"
               data-theme="filled_black"
               data-text="signin_with"
               data-size="large"
               data-logo_alignment="left">
          </div>
        </div>

        <div class="status" id="status">
          <span class="dot"></span>
          <span>Token qabul qilindi</span>
        </div>

        <div class="token-frame" id="tokenFrame">
          <div class="token-frame-label">
            <span>ID Token</span>
            <span id="tokenLen"></span>
          </div>
          <div class="token-box" id="output"></div>
          <button class="copy-btn" id="copyBtn" onclick="copyToken()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span id="copyLabel">Nusxalash</span>
          </button>
        </div>
      </div>
    </div>

    <div class="foot-note">Bu sahifa faqat <b>ishlab chiqish (dev)</b> muhiti uchun mo'ljallangan.</div>
  </div>

<script>
  let currentToken = "";

  function handleCredentialResponse(response) {
    currentToken = response.credential;
    document.getElementById("output").innerText = currentToken;
    document.getElementById("tokenLen").innerText = currentToken.length + " belgi";
    document.getElementById("tokenFrame").classList.add("visible");
    document.getElementById("status").classList.add("show");
  }

  function copyToken(){
    if(!currentToken) return;
    navigator.clipboard.writeText(currentToken).then(() => {
      const btn = document.getElementById("copyBtn");
      const label = document.getElementById("copyLabel");
      btn.classList.add("copied");
      label.innerText = "Nusxalandi ✓";
      setTimeout(() => {
        btn.classList.remove("copied");
        label.innerText = "Nusxalash";
      }, 1800);
    });
  }
</script>
